<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .19" numOctaves="4" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values=".18"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues=".26 .72"/>
        <feFuncG type="table" tableValues=".18 .57"/>
        <feFuncB type="table" tableValues=".09 .34"/>
        <feFuncA type="table" tableValues=".18 .42"/>
      </feComponentTransfer>
    </filter>
    <filter id="fibers" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".004 .32" numOctaves="2" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues=".18 .82"/>
        <feFuncG type="table" tableValues=".12 .62"/>
        <feFuncB type="table" tableValues=".05 .38"/>
        <feFuncA type="table" tableValues="0 .28"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="shade" cx="48%" cy="42%" r="76%">
      <stop offset="0" stop-color="#d4ae78" stop-opacity=".12"/>
      <stop offset=".72" stop-color="#77491f" stop-opacity=".08"/>
      <stop offset="1" stop-color="#4c2b12" stop-opacity=".28"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1200" fill="#b88c59"/>
  <rect width="1600" height="1200" filter="url(#paper)" opacity=".72"/>
  <rect width="1600" height="1200" filter="url(#fibers)" opacity=".52"/>
  <rect width="1600" height="1200" fill="url(#shade)"/>
</svg>
